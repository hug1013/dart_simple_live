name: app-build-action

# 推送 Tag 时触发或手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag，例如 v1.2.3"
        required: true
        type: string
      source_ref:
        description: "手动触发时要构建的分支/Tag/SHA，默认 master"
        required: false
        default: "master"
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
  TARGET_COMMITISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.sha }}

jobs:
  build-mac-ios-android:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # 设置 JAVA 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # APK 签名设置
      # 如果 KEYSTORE_BASE64 存在：使用正式签名
      # 如果 KEYSTORE_BASE64 为空：自动生成临时签名，避免构建失败
      - name: Prepare Android signing key
        id: android_keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p simple_live_app/android

          KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          export KEYSTORE_PATH

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using KEYSTORE_BASE64 from repository secrets."

            missing=0

            if [ -z "${STORE_PASSWORD:-}" ]; then
              echo "::error::STORE_PASSWORD is empty. 请在 GitHub Repository secrets 里添加 STORE_PASSWORD"
              missing=1
            fi

            if [ -z "${KEY_PASSWORD:-}" ]; then
              echo "::error::KEY_PASSWORD is empty. 请在 GitHub Repository secrets 里添加 KEY_PASSWORD"
              missing=1
            fi

            if [ -z "${KEY_ALIAS:-}" ]; then
              echo "::error::KEY_ALIAS is empty. 请在 GitHub Repository secrets 里添加 KEY_ALIAS"
              missing=1
            fi

            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            python3 - <<'PY'
          import base64
          import os

          data = os.environ.get("KEYSTORE_BASE64", "")
          data = "".join(data.split())

          if not data:
              raise SystemExit("KEYSTORE_BASE64 is empty")

          with open(os.environ["KEYSTORE_PATH"], "wb") as f:
              f.write(base64.b64decode(data))
          PY

            STORE_PASSWORD_VALUE="$STORE_PASSWORD"
            KEY_PASSWORD_VALUE="$KEY_PASSWORD"
            KEY_ALIAS_VALUE="$KEY_ALIAS"
          else
            echo "::warning::KEYSTORE_BASE64 is empty. 当前将自动生成临时 Android 签名文件。"
            echo "::warning::临时签名只能用于构建测试；正式发布建议配置 KEYSTORE_BASE64，否则用户后续可能无法覆盖安装更新。"

            STORE_PASSWORD_VALUE="${STORE_PASSWORD:-android}"
            KEY_PASSWORD_VALUE="${KEY_PASSWORD:-android}"
            KEY_ALIAS_VALUE="${KEY_ALIAS:-upload}"

            if [ "${#STORE_PASSWORD_VALUE}" -lt 6 ]; then
              STORE_PASSWORD_VALUE="android"
            fi

            if [ "${#KEY_PASSWORD_VALUE}" -lt 6 ]; then
              KEY_PASSWORD_VALUE="$STORE_PASSWORD_VALUE"
            fi

            if [ -z "$KEY_ALIAS_VALUE" ]; then
              KEY_ALIAS_VALUE="upload"
            fi

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD_VALUE" \
              -keypass "$KEY_PASSWORD_VALUE" \
              -alias "$KEY_ALIAS_VALUE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Temporary Android Signing,O=GitHub Actions,C=US"
          fi

          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$STORE_PASSWORD_VALUE"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "keyAlias=$KEY_ALIAS_VALUE"
          } > simple_live_app/android/key.properties

          echo "filePath=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      # 设置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开 MAC Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新 Flutter packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 安装 appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传 APK 至 Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 打包 iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 创建未签名 IPA
      - name: Create IPA
        run: |
          cd simple_live_app
          rm -rf build/ios/iphoneos/Payload
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      # 上传 IPA 至 Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 打包 MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 上传 MAC 至 Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Mac/iOS/Android job's status is ${{ job.status }}."

  # 打包 Linux
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv

      # 打开 Linux Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop

      # 更新 Flutter packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # 打包 Linux
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      # 上传 Linux 包至 Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包 Windows
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开 Windows Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      # 更新 Flutter packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        shell: pwsh
        run: |
          dart pub global activate flutter_distributor
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Pub\Cache\bin"

      # 打包 Windows
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      # 上传 Windows 至 Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Windows job's status is ${{ job.status }}."

  # 统一上传至 GitHub Release
  release:
    name: Upload Release
    runs-on: ubuntu-22.04
    needs:
      - build-mac-ios-android
      - build-linux
      - build-windows
    permissions:
      contents: write

    steps:
      # 下载所有构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # 创建或更新 Release
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: |
          set -euo pipefail

          echo "Release tag: $RELEASE_TAG"
          echo "Build ref: $BUILD_REF"
          echo "Target commitish: $TARGET_COMMITISH"

          echo "Release files:"
          find release-assets -type f -print | sort

          mapfile -t FILES < <(
            find release-assets -type f \
              \( -name "*.apk" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.zip" -o -name "*.deb" -o -name "*.msix" \) \
              | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          tag_lower="${RELEASE_TAG,,}"
          CREATE_ARGS=(--title "$RELEASE_TAG" --generate-notes --target "$TARGET_COMMITISH")

          if [[ "$tag_lower" == *beta* || "$tag_lower" == *alpha* ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, upload assets with --clobber."
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            echo "Release $RELEASE_TAG does not exist, create release."
            gh release create "$RELEASE_TAG" "${FILES[@]}" "${CREATE_ARGS[@]}"
          fi

      # 完成
      - name: Release job status
        if: always()
        run: echo "🍏 Release job's status is ${{ job.status }}."
