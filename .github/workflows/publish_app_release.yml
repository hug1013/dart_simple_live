name: app-build-action

# 推送 Tag 时触发或手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag，例如 v1.2.3"
        required: true
        type: string
      source_ref:
        description: "手动触发时要构建的分支/Tag/SHA，默认 master"
        required: false
        default: "master"
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
  TARGET_COMMITISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.sha }}

jobs:
  build-mac-ios-android:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # APK签名设置：解码 keystore
      - name: Decode Android keystore
        id: android_keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          export KEYSTORE_PATH

          python3 - <<'PY'
          import base64
          import os

          data = os.environ.get("KEYSTORE_BASE64", "")
          if not data:
              raise SystemExit("KEYSTORE_BASE64 is empty")

          with open(os.environ["KEYSTORE_PATH"], "wb") as f:
              f.write(base64.b64decode(data))
          PY

          echo "filePath=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Create key.properties
        shell: bash
        run: |
          mkdir -p simple_live_app/android
          {
            echo "storeFile=${{ steps.android_keystore.outputs.filePath }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          } > simple_live_app/android/key.properties

      # 设置JAVA环境
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 设置Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 安装 appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # 打包APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android
          if-no-files-found: error
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          rm -rf build/ios/iphoneos/Payload
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ios
          if-no-files-found: error
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 打包MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mac
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Mac/iOS/Android job's status is ${{ job.status }}."

  # 打包Linux
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv

      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # 打包 Linux
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean

      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      # 签出代码
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开Windows Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      # 更新Flutter的packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 设置 flutter_distributor 环境
      - name: Install flutter_distributor
        shell: pwsh
        run: |
          dart pub global activate flutter_distributor
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Pub\Cache\bin"

      # 打包 Windows
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: error
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      # 完成
      - name: Job status
        if: always()
        run: echo "🍏 Windows job's status is ${{ job.status }}."

  # 统一上传至 GitHub Release
  release:
    name: Upload Release
    runs-on: ubuntu-22.04
    needs:
      - build-mac-ios-android
      - build-linux
      - build-windows
    permissions:
      contents: write
    steps:
      # 下载所有构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      # 创建或更新 Release
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: |
          set -euo pipefail

          echo "Release tag: $RELEASE_TAG"
          echo "Build ref: $BUILD_REF"
          echo "Target commitish: $TARGET_COMMITISH"

          echo "Release files:"
          find release-assets -type f -print | sort

          mapfile -t FILES < <(
            find release-assets -type f \
              \( -name "*.apk" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.zip" -o -name "*.deb" -o -name "*.msix" \) \
              | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi

          tag_lower="${RELEASE_TAG,,}"
          CREATE_ARGS=(--title "$RELEASE_TAG" --generate-notes --target "$TARGET_COMMITISH")

          if [[ "$tag_lower" == *beta* || "$tag_lower" == *alpha* ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, upload assets with --clobber."
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            echo "Release $RELEASE_TAG does not exist, create release."
            gh release create "$RELEASE_TAG" "${FILES[@]}" "${CREATE_ARGS[@]}"
          fi

      # 完成
      - name: Release job status
        if: always()
        run: echo "🍏 Release job's status is ${{ job.status }}."
