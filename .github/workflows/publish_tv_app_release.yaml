name: tv-build-action

on:
  push:
    tags:
      - "tv_*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag，例如 tv_1.0.0"
        required: true
        type: string
      source_ref:
        description: "手动触发时要构建的分支/Tag/SHA，默认 master"
        required: false
        default: "master"
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref }}
  TARGET_COMMITISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.sha }}

jobs:
  build-tv:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 优先使用 TV 专用签名；
      # 如果 TV secrets 没配，则兼容使用 app 的签名；
      # 两套都没有，就自动生成临时 keystore，避免构建直接失败。
      - name: Prepare Android signing key
        id: android_tv_keystore
        shell: bash
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p simple_live_tv_app/android
          KEYSTORE_PATH="$RUNNER_TEMP/tv_keystore.jks"
          export KEYSTORE_PATH

          USE_MODE=""
          SELECTED_KEYSTORE_BASE64=""
          SELECTED_STORE_PASSWORD=""
          SELECTED_KEY_PASSWORD=""
          SELECTED_KEY_ALIAS=""

          if [ -n "${TV_KEYSTORE_BASE64:-}" ] && [ -n "${TV_STORE_PASSWORD:-}" ] && [ -n "${TV_KEY_PASSWORD:-}" ] && [ -n "${TV_KEY_ALIAS:-}" ]; then
            USE_MODE="tv"
            SELECTED_KEYSTORE_BASE64="$TV_KEYSTORE_BASE64"
            SELECTED_STORE_PASSWORD="$TV_STORE_PASSWORD"
            SELECTED_KEY_PASSWORD="$TV_KEY_PASSWORD"
            SELECTED_KEY_ALIAS="$TV_KEY_ALIAS"
          elif [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            USE_MODE="app"
            SELECTED_KEYSTORE_BASE64="$KEYSTORE_BASE64"
            SELECTED_STORE_PASSWORD="$STORE_PASSWORD"
            SELECTED_KEY_PASSWORD="$KEY_PASSWORD"
            SELECTED_KEY_ALIAS="$KEY_ALIAS"
          fi

          if [ -n "$USE_MODE" ]; then
            echo "Using $USE_MODE signing secrets."
            SELECTED_KEYSTORE_BASE64="$(printf '%s' "$SELECTED_KEYSTORE_BASE64" | tr -d '\r\n\t ')"
            export SELECTED_KEYSTORE_BASE64

            python3 - <<'PY'
          import base64
          import os

          data = os.environ.get("SELECTED_KEYSTORE_BASE64", "")
          if not data:
              raise SystemExit("Selected keystore base64 is empty")

          with open(os.environ["KEYSTORE_PATH"], "wb") as f:
              f.write(base64.b64decode(data))
          PY

            STORE_PASSWORD_VALUE="$SELECTED_STORE_PASSWORD"
            KEY_PASSWORD_VALUE="$SELECTED_KEY_PASSWORD"
            KEY_ALIAS_VALUE="$SELECTED_KEY_ALIAS"
          else
            echo "::warning::未检测到完整的 TV/App 签名 Secrets，将自动生成临时 keystore。"
            echo "::warning::如果要正式发布并支持覆盖安装更新，请配置 TV_* 或 App 的签名 secrets。"

            STORE_PASSWORD_VALUE="${TV_STORE_PASSWORD:-${STORE_PASSWORD:-androidtv}}"
            KEY_PASSWORD_VALUE="${TV_KEY_PASSWORD:-${KEY_PASSWORD:-androidtv}}"
            KEY_ALIAS_VALUE="${TV_KEY_ALIAS:-${KEY_ALIAS:-upload}}"

            if [ "${#STORE_PASSWORD_VALUE}" -lt 6 ]; then
              STORE_PASSWORD_VALUE="androidtv"
            fi
            if [ "${#KEY_PASSWORD_VALUE}" -lt 6 ]; then
              KEY_PASSWORD_VALUE="$STORE_PASSWORD_VALUE"
            fi
            if [ -z "$KEY_ALIAS_VALUE" ]; then
              KEY_ALIAS_VALUE="upload"
            fi

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD_VALUE" \
              -keypass "$KEY_PASSWORD_VALUE" \
              -alias "$KEY_ALIAS_VALUE" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Temporary Android TV Signing,O=GitHub Actions,C=US"
          fi

          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$STORE_PASSWORD_VALUE"
            echo "keyPassword=$KEY_PASSWORD_VALUE"
            echo "keyAlias=$KEY_ALIAS_VALUE"
          } > simple_live_tv_app/android/key.properties

          echo "filePath=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_tv
          if-no-files-found: error
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Read version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("assets/tv_app_version.json").read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip() or os.environ.get("RELEASE_TAG", "")
          prerelease = str(bool(data.get("prerelease", False))).lower()
          version_desc = str(data.get("version_desc", "")).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"prerelease={prerelease}\n")

          Path("release_body.md").write_text(f"# Android TV\n\n{version_desc}\n", encoding="utf-8")
          PY

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_COMMITISH }}
          name: "${{ steps.version.outputs.version }}"
          body_path: release_body.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          token: ${{ secrets.TOKEN || github.token }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Job status
        if: always()
        run: echo "🍏 TV job's status is ${{ job.status }}."
